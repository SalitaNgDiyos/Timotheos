<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe6db">
<title>Tanglaw Bible</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header class="titlebar" data-tauri-drag-region>
  <span class="logo" data-tauri-drag-region><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M12 6.5v6M9.5 9h5"/></svg></span>
  <span class="name" data-tauri-drag-region>Tanglaw Bible</span>
  <button id="biblesBtn" class="tbtn" title="Bibles and modules"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.6l3.8-1 3.7 15.5-3.8 1z"/></svg><span class="lbl">Bibles</span></button>
  <div class="desk tools">
    <select id="bookSel" aria-label="Book"></select><select id="chapSel" aria-label="Chapter"></select><select id="verseSel" aria-label="Verse" title="Verse"></select>
    <button id="prev" class="tbtn" title="Previous chapter (←)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="next" class="tbtn" title="Next chapter (→)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="copyBtn" class="tbtn" title="Copy verses (F5)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
  </div>
  <span class="drag" data-tauri-drag-region></span>
  <button id="skinBtn" class="tbtn" title="Skin and view"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.8-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.2-9-7.2z"/></svg><span class="lbl">Skin</span></button>
  <button id="sideBtn" class="tbtn desk" title="Show or hide the study panel (commentary, library, search)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span class="lbl">Study</span></button>
  <span class="winbtns desk"><button id="wMin" aria-label="Minimise"><svg viewBox="0 0 12 12" width="11" height="11"><path d="M1 6h10" stroke="currentColor"/></svg></button><button id="wMax" aria-label="Maximise"><svg viewBox="0 0 12 12" width="11" height="11"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button><button id="wClose" class="x" aria-label="Close"><svg viewBox="0 0 12 12" width="11" height="11"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor"/></svg></button></span>
  <div id="bibleMenu" class="menu hidden"></div>
  <div id="skinMenu" class="menu right hidden"></div>
</header>
<div id="work">
<main id="center">
  <div class="cap"><span id="capRef"></span><span class="grow"></span><span id="timing" class="small"></span></div>
  <div id="view" class="view" tabindex="0"></div>
  <div id="empty" class="empty hidden"><h2>No Bibles yet</h2><p>Import theWord (.ont, .ot, .nt) or e-Sword (.bblx, .bbli) Bibles. Add a Strong's dictionary (.dct.twm, .lexi, .dctx) to see word meanings.</p><button id="emptyImport" class="primary">Import modules…</button></div>
</main>
<div id="sideSplit" class="desk" title="Drag to make the panel wider or narrower"></div>
<aside id="side">
  <div class="ptabs"><button data-ptab="cmt">Commentary</button><button data-ptab="lib">Library</button><button data-ptab="search">Search</button><button data-ptab="study">My Study</button><span class="grow"></span><button id="sideClose" class="phoneonly" aria-label="Close">✕</button></div>
  <section class="ptab" id="p-cmt"><div class="phead" id="cmtHead"></div><div class="chips" id="cmtChips"></div><div id="cmtBody" class="pbody entrybody"></div></section>
  <section class="ptab hidden" id="p-lib">
    <div class="libbar"><select id="libMod" aria-label="Module"></select>
      <button id="libProps" class="ib" title="Properties of this module" aria-label="Properties"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      <button id="libBack" class="ib" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
      <button id="libPrev" class="ib" title="Previous topic" aria-label="Previous topic"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="libNext" class="ib" title="Next topic" aria-label="Next topic"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="libsplit"><div class="libside"><input id="libFilter" type="search" placeholder="Find a topic…" spellcheck="false"><ul id="libTopics" tabindex="0"></ul><div id="libCount" class="small"></div></div>
      <div id="libBody" class="pbody entrybody"><p class="hint">Choose a commentary, dictionary or book.</p></div></div>
  </section>
  <section class="ptab hidden" id="p-search"></section>
  <section class="ptab hidden" id="p-study"><div class="seg" id="studyTabs"><button data-st="lists">Verse lists</button><button data-st="notes">Notes</button><button data-st="plans">Reading</button></div><div id="studyBody" class="pbody"></div></section>
</aside>
</div>
<nav class="phonebar"><button id="pPrev" aria-label="Previous chapter"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><button id="refBtn" class="ref">…</button><button data-open="cmt" aria-label="Commentary"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button data-open="lib" aria-label="Library"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5zM12 6v13.5"/></svg></button><button data-open="study" aria-label="My Study"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button><button data-open="search" aria-label="Search"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button id="pNext" aria-label="Next chapter"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></nav>
<footer class="status"><span id="status"></span></footer>
<div id="popup" class="popup hidden"></div>
<div id="vmenu" class="menu vmenu hidden"></div>
<div id="sheet" class="sheet"><div class="sheetpanel"><div class="grab"></div><div id="sheetBody"></div></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
