<html lang="en">
<head>
<meta charset="utf-8">
<title>Timotheos – Layout &amp; Panels</title>
<style>
  :root { --bg:#16191f; --card:#1f242d; --line:#323946; --text:#e8edf5; --muted:#9aa5b5; --accent:#22c55e; --accent-soft:rgba(34,197,94,.16); --font-ui:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f9; --card:#ffffff; --line:#d5dce6; --text:#1d2430; --muted:#5c6778; --accent:#16a34a; --accent-soft:rgba(22,163,74,.12); } }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 var(--font-ui); }
  .wrap { display:flex; flex-direction:column; height:100%; }
  header { padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header b { font-size:13.5px; flex:1; }
  header button { border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:6px; padding:4px 8px; font:12px var(--font-ui); cursor:pointer; }
  header button:hover { border-color:var(--accent); }
  main { flex:1; overflow:auto; padding:10px 12px 16px; }
  .mh { font:700 11px var(--font-ui); text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:12px 0 6px; }
  .mh:first-child { margin-top:2px; }
  .warn { padding:9px 10px; border-radius:8px; border:1px solid rgba(217,119,6,.5); background:rgba(245,158,11,.12); margin-bottom:8px; }
  .warn b { display:block; margin-bottom:2px; }
  .warn small { color:var(--muted); font-size:11.5px; }
  .item, .act { width:100%; display:flex; align-items:center; gap:8px; padding:7px 10px; margin:3px 0; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); font:13px var(--font-ui); cursor:pointer; text-align:left; }
  .item:hover:not(:disabled), .act:hover { background:var(--accent-soft); border-color:var(--accent); }
  .item:disabled { opacity:.45; cursor:not-allowed; }
  .item .hint { margin-left:auto; font-size:11px; color:var(--muted); }
  .act.on { border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
  .hist { display:flex; gap:6px; } .hist .act { justify-content:center; } .act:disabled { opacity:.4; cursor:default; }
  .sub { font-size:11.5px; color:var(--muted); margin:4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Layout &amp; Panels</b>
    <button type="button" id="dockBackBtn" title="Move this dialog back inside the main Timotheos window">Dock inside app</button>
  </header>
  <main id="root"><p class="sub">Connecting to Timotheos…</p></main>
</div>
<script>
(function () {
  const ch = new BroadcastChannel('timotheos-panels');
  let st = null;
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function send(msg) { ch.postMessage(msg); }
  function render() {
    const root = document.getElementById('root');
    if (!st) return;
    const hasSpace = st.spaces > 0;
    const warn = hasSpace
      ? `<p class="sub">${st.spaces} empty slot${st.spaces === 1 ? '' : 's'} ready. Click any panel below to place it into the next empty space.</p>`
      : `<div class="warn"><b>There is no more space available.</b><small>Turn on Edit Layout and move or resize panels, or click Close all panels to design a fresh grid.</small></div>`;
    const kinds = (st.kinds || []).map(k =>
      `<button type="button" class="item" data-place="${esc(k.id)}"${hasSpace ? '' : ' disabled'}><span>${esc(k.title)}</span><span class="hint">${hasSpace ? 'place' : ''}</span></button>`
    ).join('');
    const presets = (st.presets || []).map(p =>
      `<button type="button" class="act" data-preset="${esc(p.id)}"><b>${esc(p.title)}</b></button>`
    ).join('');
    root.innerHTML = `
      <div class="hist"><button type="button" class="act" data-cmd="undo" title="Undo a layout change"${st.canUndo ? '' : ' disabled'}>↶ Undo</button><button type="button" class="act" data-cmd="redo" title="Redo a layout change"${st.canRedo ? '' : ' disabled'}>↷ Redo</button></div>
      <div class="mh">Panels (click to place in empty space)</div>
      ${warn}${kinds}
      <div class="mh">Arranging</div>
      <button type="button" class="act${st.detach ? ' on' : ''}" data-cmd="detach">${st.detach ? '✓ ' : ''}Edit Layout (leave empty spaces)</button>
      <button type="button" class="act" data-cmd="reset">Reset Layout (back to Classic)</button>
      <button type="button" class="act" data-cmd="clearAll">Close all panels (Design your layout)</button>
      <div class="mh">Layouts</div>
      ${presets}
      <button type="button" class="act" data-cmd="save">+ Save current layout as…</button>
    `;
    root.querySelectorAll('[data-place]').forEach(b => b.onclick = () => send({ type: 'place', id: b.dataset.place }));
    root.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => send({ type: 'preset', id: b.dataset.preset }));
    root.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send({ type: 'cmd', cmd: b.dataset.cmd }));
  }
  document.getElementById('dockBackBtn').onclick = () => { send({ type: 'dockBack' }); window.close(); };
  ch.onmessage = e => { if (e.data && e.data.type === 'state') { st = e.data.state; render(); } };
  send({ type: 'hello' });
  window.addEventListener('beforeunload', () => send({ type: 'bye' }));
  // Ctrl+Alt+Z / Ctrl+Alt+Y work in this window too
  document.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && !e.shiftKey && /^[zy]$/i.test(e.key)) { e.preventDefault(); send({ type: 'cmd', cmd: e.key.toLowerCase() === 'z' ? 'undo' : 'redo' }); } });
})();
</script>
</body>
</html>
