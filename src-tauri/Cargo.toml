[package]
name = "timotheos"
version = "0.6.24"
description = "Timotheos"
license = "AGPL-3.0-or-later"
authors = ["Edmund P. Valdez"]
repository = "https://github.com/SalitaNgDiyos/Timotheos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "timotheos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
url = "2"
# downloads for the "Download modules" window only (https, certificates built in so that Android needs nothing else)
sha2 = "0.10"   # the fingerprint of a downloaded update is checked before it is run
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-tts = "0.2"   # Android's own text-to-speech: the web view has no speech engine of its own

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
