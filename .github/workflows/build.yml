# Builds Tanglaw for Windows, Linux and Android on GitHub's machines and attaches the files to the run
# (Actions → the run → Artifacts). Start it by hand (Actions → Build Tanglaw → Run workflow) or by pushing.
name: Build Tanglaw
on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: tanglaw-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    # GitHub's Ubuntu machines come with the Android SDK and NDK installed (ANDROID_HOME, ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build the APK (debug-signed, for testing)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Android SDK: $ANDROID_HOME, NDK: $NDK_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --debug --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: tanglaw-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
