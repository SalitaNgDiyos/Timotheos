# Builds Timotheos (Tauri 2) on GitHub's machines: Linux (.deb, .AppImage), Windows (installer) and Android (APK).
# Automatically skips Android when changes are PC-only, and skips Linux/Windows when changes are Android-only.
# Commit messages may also include [pc-only] or [android-only] to override platform selection.
name: Build Timotheos
on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: "Build Linux and Windows desktop installers"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true
  push:
    branches: ["**"]
    paths-ignore: ["release-notes/**", "WHATSNEW.txt"]   # correcting notes alone does not rebuild (fix-notes.yml does that)

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DESKTOP: ${{ inputs.build_desktop }}
          INPUT_ANDROID: ${{ inputs.build_android }}
        run: |
          python3 - <<'PY'
          import os, subprocess

          out = os.environ["GITHUB_OUTPUT"]
          ev = os.environ.get("EVENT_NAME", "")

          def write_out(desk, andr, reason):
              print(f"Platform decision: desktop={desk}, android={andr} ({reason})")
              with open(out, "a") as f:
                  f.write(f"desktop={'true' if desk else 'false'}\n")
                  f.write(f"android={'true' if andr else 'false'}\n")

          if ev == "workflow_dispatch":
              d = os.environ.get("INPUT_DESKTOP", "true").lower() == "true"
              a = os.environ.get("INPUT_ANDROID", "true").lower() == "true"
              write_out(d, a, "workflow_dispatch inputs")
              raise SystemExit(0)

          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%B"], text=True).lower()
          if "[pc-only]" in msg or "[desktop-only]" in msg or "[no-android]" in msg:
              write_out(True, False, "commit tag [pc-only]")
              raise SystemExit(0)
          if "[android-only]" in msg or "[phone-only]" in msg or "[no-pc]" in msg:
              write_out(False, True, "commit tag [android-only]")
              raise SystemExit(0)

          try:
              diff = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True).splitlines()
          except Exception:
              write_out(True, True, "no parent commit; building all")
              raise SystemExit(0)

          meta_exact = {
              "package.json", "package-lock.json",
              "src-tauri/tauri.conf.json", "src-tauri/Cargo.toml", "src-tauri/Cargo.lock",
              "WHATSNEW.txt", "app/renderer/guide.html",
          }
          def is_meta(p):
              return p in meta_exact or p.startswith("release-notes/") or p.startswith("test/") or p.startswith(".github/")

          android_exact = {
              "app/renderer/pui.js", "app/renderer/pui.css", "app/renderer/phone.js",
              "app/renderer/skins.js", "app/renderer/skins.css",
              "app/renderer/skin-a.js", "app/renderer/skin-b.js", "app/renderer/skin-c.js",
          }
          pc_exact = {
              "app/renderer/dock.js", "app/renderer/workbench.css", "app/renderer/titlebar.js",
              "app/renderer/panelskin-ui.js", "app/renderer/viewmenu-ui.js", "app/renderer/download.js",
          }

          code = [p for p in diff if p and not is_meta(p)]
          if not code:
              write_out(True, True, "metadata-only change; building all")
              raise SystemExit(0)

          only_android = all(p.startswith("android/") or p in android_exact for p in code)
          only_pc = all(p in pc_exact for p in code)

          if only_android:
              write_out(False, True, f"android-only files: {code}")
          elif only_pc:
              write_out(True, False, f"pc-only files: {code}")
          else:
              write_out(True, True, f"shared files changed: {code}")
          PY

  linux:
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Unit tests and licence check
        run: node test/unit/subfolders.test.js && node test/unit/archivescan.test.js && node test/unit/dock.test.js && node test/unit/bigzip.test.js && node scripts/check-licence.mjs
      - name: Download modules really reaches eBible.org over https
        run: npm run build:web && cd src-tauri && cargo test --lib && cargo test --lib -- --ignored the_ebible_list
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # not `npm ci`: the lock file was made on Linux and lacks the Windows copies of the tauri and esbuild programs
      - name: Install (without the Linux-made lock file)
        shell: pwsh
        run: |
          Remove-Item package-lock.json
          npm install --no-audit --no-fund
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    needs: [changes]
    if: ${{ needs.changes.outputs.android == 'true' }}
    # GitHub's Ubuntu machines come with the Android SDK and NDK installed (ANDROID_HOME, ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build the release APK (small) and sign it with the test key
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Android SDK: $ANDROID_HOME, NDK: $NDK_HOME"
          npx tauri android init --ci
          # the app's own launcher icon (src-tauri/icons/android) over the generated one
          RES=src-tauri/gen/android/app/src/main/res; cp -r src-tauri/icons/android/. "$RES"/; ls "$RES"/mipmap-xxxhdpi
          # keep the page between the status bar and the navigation bar (Android 15 draws apps under them)
          MA=$(find src-tauri/gen/android -name MainActivity.kt | head -1)
          echo "MainActivity: $MA"
          sed 's/__PKG__/org.timotheos.bible/' android/MainActivity.kt.tpl > "$MA"
          sed 's/__PKG__/org.timotheos.bible/' android/SpeechService.kt.tpl > "$(dirname "$MA")/SpeechService.kt"
          # "Download modules" needs the permission to use the internet (the generated manifest has it; this makes sure)
          MF=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' "$MF"
          grep -n 'INTERNET' "$MF"
          # "Download and install" an update: permission to ask Android to install an APK, and a file provider for the app's cache folder
          grep -q 'REQUEST_INSTALL_PACKAGES' "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$MF"
          sed -i 's#</application>#    <provider android:name="org.timotheos.bible.UpdateFileProvider" android:authorities="${applicationId}.updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/update_paths" /></provider>\n    </application>#' "$MF"
          mkdir -p "$RES/xml"; printf '<?xml version="1.0" encoding="utf-8"?>\n<paths><cache-path name="updates" path="." /></paths>\n' > "$RES/xml/update_paths.xml"
          # reading aloud with the screen off: a media foreground service, notification buttons, a wake lock, and the question about battery optimisation
          for P in FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS WAKE_LOCK REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            grep -q "android.permission.$P\"" "$MF" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$MF"
          done
          sed -i 's#</application>#    <service android:name="org.timotheos.bible.SpeechService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' "$MF"
          grep -n 'SpeechService\|FOREGROUND_SERVICE\|WAKE_LOCK\|IGNORE_BATTERY\|POST_NOTIFICATIONS' "$MF"
          grep -n 'REQUEST_INSTALL_PACKAGES\|UpdateFileProvider' "$MF"
          G=src-tauri/gen/android/app/build.gradle.kts
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation("androidx.core:core-ktx:1.13.1")/' "$G"
          grep -n -A2 "^dependencies {" "$G"
          # every build gets a higher versionCode (the run number), so that Android installs it as an update of the one on the phone
          npx tauri android build --apk --target aarch64 --target armv7 --config "{\"bundle\":{\"android\":{\"versionCode\":$((100000 + GITHUB_RUN_NUMBER))}}}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "built: $APK"
          mkdir -p signed
          "$BT/zipalign" -p -f 4 "$APK" signed/aligned.apk
          "$BT/apksigner" sign --ks .github/test-signing.jks --ks-pass pass:timotheos --key-pass pass:timotheos --out signed/Timotheos-android.apk signed/aligned.apk
          "$BT/apksigner" verify signed/Timotheos-android.apk
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-android
          path: signed/Timotheos-android.apk

  draft:
    # publishes built files in a public release whenever at least one platform succeeded and none failed
    if: ${{ always() && !cancelled() && github.event_name != 'release' && needs.linux.result != 'failure' && needs.windows.result != 'failure' && needs.android.result != 'failure' && (needs.linux.result == 'success' || needs.windows.result == 'success' || needs.android.result == 'success') }}
    needs: [changes, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Publish the files in a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out dl
          find dl -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) -exec cp {} out/ \;
          n=0; for a in $(find dl -name '*.apk'); do n=$((n+1)); cp "$a" "out/Timotheos_android-test-${n}.apk"; done
          # AGPL: the complete source of exactly this build travels with its files
          git archive --format=zip --prefix="timotheos-${GITHUB_SHA::7}/" -o "out/timotheos-source-${GITHUB_SHA::7}.zip" "$GITHUB_SHA"
          ls -la out
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          V=$(node -p "require('./package.json').version")
          head -1 WHATSNEW.txt | grep -q "Timotheos $V" || { echo "WHATSNEW.txt must begin with: Timotheos $V"; exit 1; }
          { cat WHATSNEW.txt; echo; echo "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}"; } > notes.txt
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" --title "Timotheos_$V" --notes-file notes.txt out/*
      - name: Keep the newest test build in the pre-release "test" (what Check for updates reads when "Include test builds" is on)
        if: ${{ github.event_name == 'push' && (github.ref_name == 'timotheos-tauri' || github.ref_name == 'Neon') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          { cat WHATSNEW.txt; echo; echo "Test build ${V} of ${GITHUB_SHA::7}. Not a finished release: the files are replaced by the next test build."; } > notes.txt
          gh release delete neon -R "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release delete test -R "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create test -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Timotheos_$V (test build)" --notes-file notes.txt out/*
      - name: Prune older releases (keep newest 10 plus test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | python3 -c '
          import json, os, re, subprocess, sys
          repo = os.environ["GITHUB_REPOSITORY"]
          rels = [r for page in json.load(sys.stdin) for r in page]
          def ver(r):
              m = re.search(r"(\d+)\.(\d+)\.(\d+)", r.get("name") or r.get("tag_name") or "")
              return tuple(map(int, m.groups())) if m else (0, 0, 0)
          non_test = [r for r in rels if r.get("tag_name") != "test"]
          non_test.sort(key=lambda r: (ver(r), r.get("created_at") or ""), reverse=True)
          keep, seen, top = set(), set(), []
          for r in rels:
              if r.get("tag_name") == "test": keep.add(r["id"])
          for r in non_test:
              v = ver(r)
              if v in seen: continue
              seen.add(v); keep.add(r["id"]); top.append(r)
              if len(top) == 10: break
          for r in rels:
              if r["id"] in keep: continue
              rid, tag = r["id"], r.get("tag_name") or ""
              subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{rid}"], check=False)
              if tag and tag != "test":
                  subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repo}/git/refs/tags/{tag}"], stderr=subprocess.DEVNULL, check=False)
              print("Pruned:", r.get("name"), f"({tag})")
          '
