# Builds Timotheos (Tauri 2) on GitHub's machines: Linux (.deb, .AppImage), Windows (installer) and Android (APK).
# Start it by hand (Actions → Build Timotheos → Run workflow) or by pushing. The files are under Artifacts of the run.
# Publishing a release on GitHub (tag like v0.6.5) builds again and attaches the files to that release.
name: Build Timotheos
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # not `npm ci`: the lock file was made on Linux and lacks the Windows copies of the tauri and esbuild programs
      - run: npm install --no-audit --no-fund
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    # GitHub's Ubuntu machines come with the Android SDK and NDK installed (ANDROID_HOME, ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build the APK (debug-signed, for testing)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Android SDK: $ANDROID_HOME, NDK: $NDK_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --debug --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: github.event_name == 'release'
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          find dl -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) -exec cp {} out/ \;
          V="${TAG#v}"; n=0
          for a in $(find dl -name '*.apk'); do n=$((n+1)); cp "$a" "out/Timotheos_${V}_android-test$([ $n -gt 1 ] && echo -$n).apk"; done
          ls -la out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Timotheos $V" --notes "Timotheos $V" --prerelease
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
