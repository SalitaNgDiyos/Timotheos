# Builds Timotheos (Tauri 2) on GitHub's machines: Linux (.deb, .AppImage), Windows (installer) and Android (APK).
# Start it by hand (Actions → Build Timotheos → Run workflow) or by pushing. The files are under Artifacts of the run.
# Publishing a release on GitHub (tag like v0.6.5) builds again and attaches the files to that release.
name: Build Timotheos
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Download modules really reaches eBible.org over https
        run: npm run build:web && cd src-tauri && cargo test --lib -- --ignored the_ebible_list
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # not `npm ci`: the lock file was made on Linux and lacks the Windows copies of the tauri and esbuild programs
      - name: Install (without the Linux-made lock file)
        shell: pwsh
        run: |
          Remove-Item package-lock.json
          npm install --no-audit --no-fund
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    # GitHub's Ubuntu machines come with the Android SDK and NDK installed (ANDROID_HOME, ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build the release APK (small) and sign it with the test key
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Android SDK: $ANDROID_HOME, NDK: $NDK_HOME"
          npx tauri android init --ci
          # the app's own launcher icon (src-tauri/icons/android) over the generated one
          RES=src-tauri/gen/android/app/src/main/res; cp -r src-tauri/icons/android/. "$RES"/; ls "$RES"/mipmap-xxxhdpi
          # keep the page between the status bar and the navigation bar (Android 15 draws apps under them)
          MA=$(find src-tauri/gen/android -name MainActivity.kt | head -1)
          echo "MainActivity: $MA"
          sed 's/__PKG__/org.timotheos.bible/' android/MainActivity.kt.tpl > "$MA"
          # "Download modules" needs the permission to use the internet (the generated manifest has it; this makes sure)
          MF=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' "$MF"
          grep -n 'INTERNET' "$MF"
          G=src-tauri/gen/android/app/build.gradle.kts
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation("androidx.core:core-ktx:1.13.1")/' "$G"
          grep -n -A2 "^dependencies {" "$G"
          # every build gets a higher versionCode (the run number), so that Android installs it as an update of the one on the phone
          npx tauri android build --apk --target aarch64 --target armv7 --config "{\"bundle\":{\"android\":{\"versionCode\":$((100000 + GITHUB_RUN_NUMBER))}}}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "built: $APK"
          mkdir -p signed
          "$BT/zipalign" -p -f 4 "$APK" signed/aligned.apk
          "$BT/apksigner" sign --ks .github/test-signing.jks --ks-pass pass:timotheos --key-pass pass:timotheos --out signed/Timotheos-android.apk signed/aligned.apk
          "$BT/apksigner" verify signed/Timotheos-android.apk
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: timotheos-android
          path: signed/Timotheos-android.apk

  draft:
    # every push leaves its files in a private DRAFT release (only people with access to the repository see it)
    if: ${{ !cancelled() && github.event_name != 'release' }}
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Keep the files in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          find dl -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) -exec cp {} out/ \;
          n=0; for a in $(find dl -name '*.apk'); do n=$((n+1)); cp "$a" "out/Timotheos_android-test-${n}.apk"; done
          # AGPL: the complete source of exactly this build travels with its files
          git archive --format=zip --prefix="timotheos-${GITHUB_SHA::7}/" -o "out/timotheos-source-${GITHUB_SHA::7}.zip" "$GITHUB_SHA"
          ls -la out
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Build $TAG" --notes "Files of the build of ${GITHUB_SHA::7}" out/*
      - name: Keep the newest test build in the pre-release "test" (what Check for updates reads when "Include test builds" is on)
        # Only pushes to timotheos-tauri. The one pre-release is replaced each time. (A release made with the workflow's own token
        # does not start another build.)
        if: ${{ github.event_name == 'push' && github.ref_name == 'timotheos-tauri' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release delete test -R "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create test -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Timotheos $V (test build)" --notes "Test build ${V} of ${GITHUB_SHA::7}. Not a finished release: the files are replaced by the next test build." out/*

  release:
    if: github.event_name == 'release'
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          find dl -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) -exec cp {} out/ \;
          V="${TAG#v}"; n=0
          for a in $(find dl -name '*.apk'); do n=$((n+1)); cp "$a" "out/Timotheos_${V}_android-test$([ $n -gt 1 ] && echo -$n).apk"; done
          git archive --format=zip --prefix="timotheos-${V}/" -o "out/timotheos-${V}-source.zip" "$GITHUB_SHA"
          ls -la out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Timotheos $V" --notes "Timotheos $V" --prerelease
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
